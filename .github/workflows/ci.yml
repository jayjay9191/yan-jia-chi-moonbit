# 每次推送与 PR 自动跑 moon test + Python 测试 + verify。
# 安装方式按 MoonBit 官方文档（moonbitlang/x 等官方项目同款流程）：
# 官方安装脚本安装固定版本的 CLI 和配套核心库。
# 模式照赛簿 .github/workflows/moon-test.yml；本仓库原 moon-test.yml
# 已改名为 ci.yml（内容相同，另补 report 冒烟检查），避免两套 CI 重复跑。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '1.0.0-rc1+3c0520448'
          "$HOME/.moon/bin/moonc" -v
      - name: Check generated data is in sync
        run: |
          python3 scripts/generate_data.py
          python3 scripts/generate_tests.py
          export PATH="$HOME/.moon/bin:$PATH"
          moon fmt
          git diff --exit-code -- pricing_data.mbt pricing_generated_test.mbt
      - name: Check and build the native CLI
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon check --target native
          moon build --target native
      - name: Validate data
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon run cmd/main -- verify
      - name: Run tests
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test
      - name: Run the suite on JavaScript
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test --target js
      - name: Verify the public library on Wasm GC
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon test review --target wasm-gc
      - name: Run Python script tests
        run: python3 -m unittest discover -s tests_py
      - name: Smoke test report
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          moon run cmd/main -- report
      - name: Verify trajectory, classes and recheck CLI
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          python3 scripts/verify_review.py
      - name: Verify structured quote observations
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          python3 scripts/verify_quote_scope.py
